---
# Follow the upstream image, once a day and on demand.
#
# The Supervisor builds the image itself, so publishing means a higher store
# version in config.yaml plus the upstream image tag in the Dockerfile, then a
# push. The two numbers are independent: the store version counts our
# publications, the image tag names an upstream release image that exists.
name: Track the upstream release

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare the image pin with the newest upstream release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version: "\(.*\)"$/\1/p' \
            pmss-fleet-manager/config.yaml)
          pin=$(sed -n 's|^ARG UPSTREAM_IMAGE=.*:\(.*\)$|\1|p' \
            pmss-fleet-manager/Dockerfile)
          tag=$(gh release view --repo AlteredParadox/pmss-fleet-manager \
            --json tagName -q .tagName)
          upstream=${tag#v}
          echo "pin=${pin} upstream=${upstream} current=${current}"
          if [ "$pin" = "$upstream" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The store version is the upstream release plus our own revision, so
          # an add-on-only change never has to wait for upstream and an upstream
          # release always sorts above the revisions of the older one.
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${upstream}.1" >> "$GITHUB_OUTPUT"
          echo "image=${upstream}" >> "$GITHUB_OUTPUT"

      - name: Check the image exists
        if: steps.pick.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # A release is published a moment before its image is, so failing
          # here just means tomorrow's run tries again.
          docker manifest inspect \
            "ghcr.io/alteredparadox/pmss-fleet-manager:${{ steps.pick.outputs.image }}" \
            > /dev/null

      - name: Write the store version and the image tag
        if: steps.pick.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          IMAGE: ${{ steps.pick.outputs.image }}
        run: |
          set -euo pipefail
          sed -i "s/^version: \".*\"$/version: \"${VERSION}\"/" \
            pmss-fleet-manager/config.yaml
          sed -i "s|^ARG UPSTREAM_IMAGE=.*|ARG UPSTREAM_IMAGE=ghcr.io/alteredparadox/pmss-fleet-manager:${IMAGE}|" \
            pmss-fleet-manager/Dockerfile
          git diff --stat

      - name: Commit
        if: steps.pick.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          IMAGE: ${{ steps.pick.outputs.image }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Publish ${VERSION} on upstream image ${IMAGE}"
          git push
