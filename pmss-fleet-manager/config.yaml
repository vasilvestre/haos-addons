name: PMSS Fleet Manager
version: "1.24.0"
slug: pmss_fleet_manager
description: Dashboard for a fleet of Pulsed Media seedboxes, read over SSH
url: https://github.com/AlteredParadox/pmss-fleet-manager
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: mdi:server-network
panel_title: PMSS Fleet
watchdog: tcp://[HOST]:[PORT:8080]
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Direct access on the LAN, without Home Assistant in the path
webui: http://[HOST]:[PORT:8080]/
options:
  login: ""
  ssh_key: ""
  allowed_hosts: ""
schema:
  login: str?
  ssh_key: password?
  allowed_hosts: str?
